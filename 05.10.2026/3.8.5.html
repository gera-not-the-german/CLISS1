<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n1=parseFloat(prompt("num1"));
        let n2=parseFloat(prompt("num2"));
        let n3=parseFloat(prompt("num3"));

        let sum=n1+n2+n3;
        let avg=Math.ceil((n1+n2+n3)/3);
        let min=Math.min(n1, n2, n3);
        let max=Math.max(n1, n2, n3);

        alert(n1+" "+n2+" "+n3+" "+"\n"+sum+"\n"+avg+"\n"+min+"\n"+max)
    </script>
</body>
</html>
