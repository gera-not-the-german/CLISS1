<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        month = prompt("Month? exactly, short, no capitalization")

        if(month == "jan" || month == "mar" || month == "may" ||  month == "jul" || month == "aug" ||  month == "oct" || month == "des"){
            alert("31 days")
        }
        else if(month == "feb"){
            alert("28 days")
        }
        else {
            alert("30 days")
        }
    </script>
</body>
</html>
