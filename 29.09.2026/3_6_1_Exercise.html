<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1=parseFloat(prompt("Enter an integer:"));
        let num2=parseFloat(prompt("Enter an decimal number:"));
        let sumfloat=num1+num2;
        alert("your parsefloat sum is "+sumfloat);
        let sumint=parseInt(num1+num2);
        alert("your parseint sum is "+sumint);
    </script>
</body>
</html>
