<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1=parseFloat(prompt("enter a number"));
        let num2=parseFloat(prompt("enter another number"));
        let max=Math.max(num1,num2);
        console.log("a is "+max);
        let avg=Math.ceil((num1+num2)/2);
        console.log("b is "+avg);
        let pi=Math.PI;
        console.log("c is "+pi);
        let randombsgo=Math.round(Math.random());
        console.log("d is "+randombsgo);
    </script>
</body>
</html>
