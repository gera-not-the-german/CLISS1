<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Double Number</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        input,
        button {
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            margin-right: 10px;
        }

        #result {
            margin-top: 20px;
            color: darkblue;
        }
    </style>
</head>

<body>

    <h1>Double Your Number</h1>

    <label for="numInput">Enter a number:</label><br>
    <input type="number" id="numInput" placeholder="e.g. 5">

    <br>
    <button id="dblBtn">Double!</button>
    <button id="resetBtn">Reset</button>

    <h2 id="result">Result: </h2>

    <script>
        //start coding here
        let numInput = document.getElementById("numInput").value;
        let pressed = 0;

        let dblBtn = document.getElementById("dblBtn");
        dblBtn.addEventListener("click", double);

        console.log(numInput);
        console.log(pressed);
        console.log(result);

        function double(){
            if(pressed == 0){
                let result = numInput*2;
                pressed = pressed+1;
                console.log(result);
                console.log(pressed);
            }
            else{
                result = result*2;  
                console.log(result); 
                console.log(pressed);             
            }
        };

        console.log(numInput);
        console.log(pressed);
        console.log(result);

        document.getElementById("result").innerHTML = "Result: "+result;
    </script>

</body>

</html>
