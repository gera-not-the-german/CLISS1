<!DOCTYPE html>
</html lang=en>
    <head>
    <title>5.4.7 Exercise</title>
    <meta charset="UTF-8">
    </head>
    <body>
        <h1>Phone status checker</h1>
        <h2 id= "statusText";></h2>
        <img id= "imageStatus" width = "500" height="500">
        <script>
        //write here your code instructions
        let current = parseInt(prompt("whats ya battery charge?"));
        let charging = prompt("is it charging? 'yes' or 'no'");

        if(current > 80 && charging != "yes"){
            document.getElementById("statusText").innerHTML = "High"
            document.getElementById("imageStatus").src = "./Pictures/Battery_status_high.png"
        }
        else if(current <= 80 && current > 20 && charging != "yes"){
            document.getElementById("statusText").innerHTML = "Ok"
            document.getElementById("imageStatus").src = "./Pictures/Battery_status_ok.png"
        }
        else if(current <= 20 && charging != "yes"){
            document.getElementById("statusText").innerHTML = "Low"
            document.getElementById("imageStatus").src = "./Pictures/Battery_status_low.png"
        }
        else if(current <= 20 && charging == "yes"){
            document.getElementById("statusText").innerHTML = "Low, charging"
            document.getElementById("imageStatus").src = "./Pictures/Low_Battery_Charging.png"
        }
        else if(current > 20 && charging == "yes"){
            document.getElementById("statusText").innerHTML = "Ok, charging"
            document.getElementById("imageStatus").src = "./Pictures/Charging_Battery.png"
        };
        </script>
    </body>
</html>
