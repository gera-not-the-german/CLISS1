<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Double Number</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        input,
        button {
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            margin-right: 10px;
        }

        #result {
            margin-top: 20px;
            color: darkblue;
        }
    </style>
</head>

<body>

    <h1>Double Your Number</h1>

    <label for="numInput">Enter a number:</label><br>
    <input type="number" id="numInput" placeholder="e.g. 5">

    <br>
    <button id="dblBtn">Double!</button>
    <button id="resetBtn">Reset</button>

    <h2 id="result">Result: </h2>

    <script>
        //start coding here
        
        let pressed = 0;
        let resultnum = 0;
        
        dblBtn.addEventListener("click", double)

        console.log(numInput);
        console.log(pressed);
        console.log(resultnum);

        function double(){
            if(pressed == 0){
                let numInput = document.getElementById("numInput").value;
                resultnum = parseFloat(numInput*2);
                pressed = pressed+1;
                document.getElementById("result").innerHTML = "Result: "+resultnum;
            }
            else{
                resultnum = parseFloat(resultnum*2);      
                document.getElementById("result").innerHTML = "Result: "+resultnum;      
            }
        };

        resetBtn.addEventListener("click", reset);

        function reset(){
            resultnum = 0;
            pressed = 0;

        };

        
    </script>

</body>

</html>
