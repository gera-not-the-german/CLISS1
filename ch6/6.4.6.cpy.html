<!DOCTYPE html>
<html lang=en>
	<head>
		<title>Exercise 6.4.6 Monkey</title>
		<meta charset=UTF-8>
	<body>
		<img src="./pictures/gorilla236x256.png" id="gorillaImage">
		<script>
			'use strict';

			let gorilla;

			function init(){
				gorilla = document.getElementById('gorillaImage');
				gorilla.style.cssText = "position: relative; top: 0; left: 0";
			}
			
			addEventListener("mousemove", move);

			function move(){
				gorilla.style.left = event.clientX + 'px';
				gorilla.style.top = event.clientY + 'px';
			}

			addEventListener('load', init);
		</script>
	</head>
	</body>
</html>
