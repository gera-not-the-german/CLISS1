<!DOCTYPE html>     
<html>
    <head>
        <title>8.5.3 Exercise</title>
        
        <style type="text/css">
            #table
            {
                    display: none;
            }
        </style>
    </head>
    
    <body>
        <h1>Student List</h1>
        
        <form action="">
            <label for="name">Student name: </label>
            <input type="text" id="name">
            <br>
            
            <label for="age">Age: </label>
            <input type="text" id="age">
            <br>
            
            <label for="gender">Gender: </label>
            <input type="text" id="gender">
            <br>
            
            <input type="button" id="submit" value="Submit">
            <br>
        </form>
        
        <table id="table">
            <tr>
                <th>Student name</th>
                <th>Age</th>
                <th>Gender</th>
            </tr>
        </table>
    
        <script>
        //check out this link for help: https://developer.mozilla.org/en-US/docs/Web/API/HTMLTableElement/insertRow 
        document.getElementById("submit").addEventListener("click",addStudent);
        
        function addStudent()
        {
            document.querySelector("head style").sheet.cssRules[0].style.display = "";
            //i have no idea why this works and id doesnt but oh well </3

            const newRow = document.getElementById("table").insertRow(-1); // adds a row
            const newCell = newRow.insertCell(0); // adds a cell to that row

            let n = document.getElementById("name").value;
            let a = document.getElementById("age").value;
            let g = document.getElementById("gender").value;

            let gask;
            if(g==="f" || g==="F"){
                gask = "Female";
            }
            else if(g==="m" || g==="M"){
                gask = "Male";
            }
            else if(g==="nb" || g==="NB" || g==="x" || g==="X"){
                gask = "Non-binary";
            }


            newCell.appendChild(document.createTextNode(n+" - "));
            newCell.appendChild(document.createTextNode(a+" - "));
            newCell.appendChild(document.createTextNode(gask)); //for immages appendchild image src



        }
        
        </script>
    </body>
</html>
